# 每日快讯 · 域名代理
# a-stock.chrisite.eu.cc  ->  nginx :443  ->  127.0.0.1:8848（FastAPI/uvicorn）
#
# 证书复用原有 Let's Encrypt 证书（域名未变，续期由 certbot.timer 自动完成）。
# 未启用 Basic Auth：站点自带注册/登录与会员分层（app.py），再叠一层 Basic Auth 会遮挡应用自身的登录页。

server {
    listen 80;
    server_name a-stock.chrisite.eu.cc;

    # 保留 ACME 校验路径，保证证书可自动续期
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name a-stock.chrisite.eu.cc;

    ssl_certificate     /etc/letsencrypt/live/a-stock.chrisite.eu.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/a-stock.chrisite.eu.cc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 16m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 应用对外只监听 127.0.0.1:8848，由 nginx 统一暴露
    location / {
        proxy_pass http://127.0.0.1:8848;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;

        # /api/refresh 会同步跑一轮采集（6 个上游源），需要放宽超时
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_buffering off;
    }
}
